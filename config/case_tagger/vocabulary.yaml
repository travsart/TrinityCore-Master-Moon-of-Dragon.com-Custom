# Doc type classification rules (keyword -> doc_type)
# Higher-weight matches win
doc_types:
  email:
    weight: 10
    keywords:
      - "Subject:"
      - "From:"
      - "To:"
      - "Sent:"
      - "Date:"
      - "RE:"
      - "FW:"
  analysis:
    weight: 5
    keywords:
      - analysis
      - assessment
      - evaluation
      - findings
      - discrepancy
      - synthesis
  brief:
    weight: 5
    keywords:
      - brief
      - summary
      - overview
      - executive summary
      - one-pager
  regulation:
    weight: 8
    keywords:
      - regulation
      - instruction
      - directive
      - DoDI
      - DoDM
      - AFI
      - DHA-PM
      - USC
      - CFR
      - policy memo
  medical:
    weight: 6
    keywords:
      - diagnosis
      - treatment
      - provider
      - clinical
      - patient
      - medical record
      - NARSUM
      - profile
      - LOD
  personnel:
    weight: 5
    keywords:
      - OPR
      - EPR
      - PRF
      - assignment
      - PCS
      - personnel action
      - performance report
  legal_filing:
    weight: 7
