      - investigation report
      - inquiry
      - findings of fact
  transcript:
    weight: 8
    keywords:
      - transcript
      - verbatim
      - testimony
      - "Q:"
      - "A:"
  index:
    weight: 6
    keywords:
      - index
      - table of contents
      - master list
      - inventory
      - catalog
  checklist:
    weight: 6
